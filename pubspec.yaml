name: requester
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 自动代码生成
  persistence_annotation:
    git:
      url: https://github.com/lvsecoto/flutter_persistence_annotation.git
      ref: 7732f6cfd0a1dcce9e228f30d941bb2a6c3fbe8b

  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  freezed_annotation: ^2.4.1

  rxdart: ^0.27.7
  dartx: ^1.2.0

  flutter_portal: ^1.1.4
  bitsdojo_window: ^0.1.6

  dio: ^5.4.3+1
  hive: ^3.0.0-dev
  hive_flutter: ^2.0.0-dev

  go_router:
  uuid: ^4.3.3
  animations: ^2.0.11
  flutter_highlight: ^0.7.0
  flutter_hooks: ^0.20.5
  multi_split_view: ^3.1.0
  network_info_plus: ^5.0.3
  qr_flutter: ^4.1.0
  synchronized: ^3.1.0
  nsd: ^3.0.0
  grpc: ^3.2.4
  protobuf: ^3.1.0
  curl_converter: ^1.0.4

  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.19+1

  conduit_open_api:
    git:
      url: https://github.com/lvsecoto/conduit.git
      path: packages/open_api
      ref: e01fd45
  easy_rich_text: ^2.1.0
  gap: ^3.0.1
  path_provider: ^2.1.3
  path: ^1.8.3
  visibility_detector: ^0.4.0+2
  animated_tree_view: ^2.2.0
  fixnum: ^1.1.0
  material_color_utilities: ^0.8.0
  highlight: ^0.7.0
  collection: ^1.18.0
  timeago: ^3.6.1
  saver_gallery: ^3.0.5
  permission_handler: ^11.3.1
  file_selector: ^1.0.3
  pro_image_editor: ^2.7.10
  animated_list_plus: ^0.5.2
  flutter_reorderable_grid_view: ^4.0.0

  requester_client:
    path: packages/requester_client
  requester_common:
    git:
      url: https://github.com/lvsecoto/requester.git
      path: packages/requester_common
      ref: 906f2f7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"
  freezed: ^2.4.7
  riverpod_generator: ^2.3.9
  riverpod_lint: ^2.3.7
  custom_lint: ^0.6.4
  build_runner: ^2.4.10
  json_serializable: ^6.8.0
  go_router_builder:

  # 自动代码生成
  persistence:
    git:
      url: https://github.com/lvsecoto/flutter_persistence.git
      ref: ddd186b

  drift_dev: ^2.18.0
  flutter_gen_runner: ^5.5.0+1

dependency_overrides:
  emoji_picker_flutter: ^2.1.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  fonts:
    - family: Digital
      fonts:
        - asset: assets/fonts/sa-digital-number.ttf

# 修改应用图标
# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
  macos:
    generate: true
  remove_alpha_ios: true
  image_path: "icon.png"
  min_sdk_android: 21

flutter_gen:
  output: lib/assets/